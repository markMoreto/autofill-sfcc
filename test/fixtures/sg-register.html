<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>SiteGenesis Register Fixture</title></head>
<body>
<div id="wrapper" class="pt_account">
  <div id="main" role="main">
    <form action="/on/demandware.store/Sites-SiteGenesis-Site/default/Account-RegistrationForm" method="post" class="form-horizontal" id="RegistrationForm">
      <fieldset>
        <div class="form-row required">
          <label for="dwfrm_profile_customer_firstname_d0abcdefghij"><span>First Name</span></label>
          <input class="input-text required" type="text" id="dwfrm_profile_customer_firstname_d0abcdefghij" name="dwfrm_profile_customer_firstname" maxlength="50">
        </div>
        <div class="form-row required">
          <label for="dwfrm_profile_customer_lastname_d1abcdefghij"><span>Last Name</span></label>
          <input class="input-text required" type="text" id="dwfrm_profile_customer_lastname_d1abcdefghij" name="dwfrm_profile_customer_lastname" maxlength="50">
        </div>
        <div class="form-row required">
          <label for="dwfrm_profile_customer_email_d2abcdefghij"><span>Email</span></label>
          <input class="input-text required" type="text" id="dwfrm_profile_customer_email_d2abcdefghij" name="dwfrm_profile_customer_email" maxlength="50">
        </div>
        <div class="form-row required">
          <label for="dwfrm_profile_customer_emailconfirm_d3abcdefghij"><span>Confirm Email</span></label>
          <input class="input-text required" type="text" id="dwfrm_profile_customer_emailconfirm_d3abcdefghij" name="dwfrm_profile_customer_emailconfirm" maxlength="50">
        </div>
        <div class="form-row required">
          <label for="dwfrm_profile_login_password_d4abcdefghij"><span>Password</span></label>
          <input class="input-text required" type="password" id="dwfrm_profile_login_password_d4abcdefghij" name="dwfrm_profile_login_password" maxlength="255">
        </div>
        <div class="form-row required">
          <label for="dwfrm_profile_login_passwordconfirm_d5abcdefghij"><span>Confirm Password</span></label>
          <input class="input-text required" type="password" id="dwfrm_profile_login_passwordconfirm_d5abcdefghij" name="dwfrm_profile_login_passwordconfirm" maxlength="255">
        </div>
        <div class="form-row checkbox">
          <input type="checkbox" id="dwfrm_profile_customer_addtoemaillist_d6abcdefghij" name="dwfrm_profile_customer_addtoemaillist" value="true">
          <label for="dwfrm_profile_customer_addtoemaillist_d6abcdefghij">Add to email list</label>
        </div>
        <button type="submit" value="Apply" name="dwfrm_profile_confirm" class="button-fancy-large">Apply</button>
      </fieldset>
    </form>
  </div>
</div>
</body>
</html>
