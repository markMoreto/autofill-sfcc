<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>SiteGenesis Checkout Fixture</title></head>
<body>
<div id="wrapper" class="pt_checkout">
  <div id="main" role="main">

    <!-- Single shipping -->
    <form action="/COShipping-SingleShipping" method="post" id="dwfrm_singleshipping_shippingAddress" class="address checkout-shipping">
      <fieldset>
        <div class="form-row required">
          <label for="dwfrm_singleshipping_shippingAddress_addressFields_firstName_d0a"><span>First Name</span></label>
          <input class="input-text required" type="text" id="dwfrm_singleshipping_shippingAddress_addressFields_firstName_d0a" name="dwfrm_singleshipping_shippingAddress_addressFields_firstName">
        </div>
        <div class="form-row required">
          <label for="dwfrm_singleshipping_shippingAddress_addressFields_lastName_d1a"><span>Last Name</span></label>
          <input class="input-text required" type="text" id="dwfrm_singleshipping_shippingAddress_addressFields_lastName_d1a" name="dwfrm_singleshipping_shippingAddress_addressFields_lastName">
        </div>
        <div class="form-row required">
          <label for="dwfrm_singleshipping_shippingAddress_addressFields_address1_d2a"><span>Address 1</span></label>
          <input class="input-text required" type="text" id="dwfrm_singleshipping_shippingAddress_addressFields_address1_d2a" name="dwfrm_singleshipping_shippingAddress_addressFields_address1">
        </div>
        <div class="form-row">
          <label for="dwfrm_singleshipping_shippingAddress_addressFields_address2_d3a"><span>Address 2</span></label>
          <input class="input-text" type="text" id="dwfrm_singleshipping_shippingAddress_addressFields_address2_d3a" name="dwfrm_singleshipping_shippingAddress_addressFields_address2">
        </div>
        <div class="form-row required">
          <label for="dwfrm_singleshipping_shippingAddress_addressFields_country_d4a"><span>Country</span></label>
          <select class="input-select required" id="dwfrm_singleshipping_shippingAddress_addressFields_country_d4a" name="dwfrm_singleshipping_shippingAddress_addressFields_country">
            <option value="">Select...</option>
            <option value="US">United States</option>
            <option value="CA">Canada</option>
            <option value="GB">United Kingdom</option>
          </select>
        </div>
        <div class="form-row required">
          <label for="dwfrm_singleshipping_shippingAddress_addressFields_states_state_d5a"><span>State</span></label>
          <select class="input-select required" id="dwfrm_singleshipping_shippingAddress_addressFields_states_state_d5a" name="dwfrm_singleshipping_shippingAddress_addressFields_states_state">
            <option value="">Select...</option>
            <option value="CA">California</option>
            <option value="NY">New York</option>
          </select>
        </div>
        <div class="form-row required">
          <label for="dwfrm_singleshipping_shippingAddress_addressFields_city_d6a"><span>City</span></label>
          <input class="input-text required" type="text" id="dwfrm_singleshipping_shippingAddress_addressFields_city_d6a" name="dwfrm_singleshipping_shippingAddress_addressFields_city">
        </div>
        <div class="form-row required">
          <label for="dwfrm_singleshipping_shippingAddress_addressFields_postal_d7a"><span>Zip Code</span></label>
          <input class="input-text required" type="text" id="dwfrm_singleshipping_shippingAddress_addressFields_postal_d7a" name="dwfrm_singleshipping_shippingAddress_addressFields_postal">
        </div>
        <div class="form-row required phone">
          <label for="dwfrm_singleshipping_shippingAddress_addressFields_phone_d8a"><span>Phone</span></label>
          <input class="input-text required phone" type="text" id="dwfrm_singleshipping_shippingAddress_addressFields_phone_d8a" name="dwfrm_singleshipping_shippingAddress_addressFields_phone">
        </div>
        <div class="form-row checkbox">
          <input type="checkbox" id="dwfrm_singleshipping_shippingAddress_useAsBillingAddress_d9a" name="dwfrm_singleshipping_shippingAddress_useAsBillingAddress" value="true">
          <label for="dwfrm_singleshipping_shippingAddress_useAsBillingAddress_d9a">Use as billing address</label>
        </div>
      </fieldset>
    </form>

    <!-- Billing + payment -->
    <form action="/COBilling-Billing" method="post" id="dwfrm_billing" class="address">
      <fieldset>
        <div class="form-row required">
          <input class="input-text required" type="text" id="dwfrm_billing_billingAddress_addressFields_firstName_e0a" name="dwfrm_billing_billingAddress_addressFields_firstName">
        </div>
        <div class="form-row required">
          <input class="input-text required" type="text" id="dwfrm_billing_billingAddress_addressFields_lastName_e1a" name="dwfrm_billing_billingAddress_addressFields_lastName">
        </div>
        <div class="form-row required">
          <input class="input-text required" type="text" id="dwfrm_billing_billingAddress_addressFields_address1_e2a" name="dwfrm_billing_billingAddress_addressFields_address1">
        </div>
        <div class="form-row required">
          <select class="input-select required" id="dwfrm_billing_billingAddress_addressFields_country_e3a" name="dwfrm_billing_billingAddress_addressFields_country">
            <option value="">Select...</option>
            <option value="US">United States</option>
          </select>
        </div>
        <div class="form-row required">
          <select class="input-select required" id="dwfrm_billing_billingAddress_addressFields_states_state_e4a" name="dwfrm_billing_billingAddress_addressFields_states_state">
            <option value="">Select...</option>
            <option value="CA">California</option>
            <option value="NY">New York</option>
          </select>
        </div>
        <div class="form-row required">
          <input class="input-text required" type="text" id="dwfrm_billing_billingAddress_addressFields_city_e5a" name="dwfrm_billing_billingAddress_addressFields_city">
        </div>
        <div class="form-row required">
          <input class="input-text required" type="text" id="dwfrm_billing_billingAddress_addressFields_postal_e6a" name="dwfrm_billing_billingAddress_addressFields_postal">
        </div>
        <div class="form-row required">
          <input class="input-text required" type="text" id="dwfrm_billing_billingAddress_addressFields_phone_e7a" name="dwfrm_billing_billingAddress_addressFields_phone">
        </div>
        <div class="form-row required">
          <input class="input-text required email" type="text" id="dwfrm_billing_billingAddress_email_emailAddress_e8a" name="dwfrm_billing_billingAddress_email_emailAddress">
        </div>
      </fieldset>
      <fieldset class="payment-method">
        <div class="form-row required">
          <input class="input-text required" type="text" id="dwfrm_billing_paymentMethods_creditCard_owner_f0a" name="dwfrm_billing_paymentMethods_creditCard_owner">
        </div>
        <div class="form-row required">
          <select class="input-select required" id="dwfrm_billing_paymentMethods_creditCard_type_f1a" name="dwfrm_billing_paymentMethods_creditCard_type">
            <option value="">Select...</option>
            <option value="Visa">Visa</option>
            <option value="Amex">American Express</option>
            <option value="Master Card">MasterCard</option>
            <option value="Discover">Discover</option>
          </select>
        </div>
        <div class="form-row required">
          <input class="input-text required" type="text" id="dwfrm_billing_paymentMethods_creditCard_number_f2a" name="dwfrm_billing_paymentMethods_creditCard_number">
        </div>
        <div class="form-row required month">
          <select class="input-select required" id="dwfrm_billing_paymentMethods_creditCard_expiration_month_f3a" name="dwfrm_billing_paymentMethods_creditCard_expiration_month">
            <option value="">Month</option>
            <option value="1">January</option><option value="2">February</option><option value="3">March</option>
            <option value="4">April</option><option value="5">May</option><option value="6">June</option>
            <option value="7">July</option><option value="8">August</option><option value="9">September</option>
            <option value="10">October</option><option value="11">November</option><option value="12">December</option>
          </select>
        </div>
        <div class="form-row required year">
          <select class="input-select required" id="dwfrm_billing_paymentMethods_creditCard_expiration_year_f4a" name="dwfrm_billing_paymentMethods_creditCard_expiration_year">
            <option value="">Year</option>
            <option value="2026">2026</option><option value="2027">2027</option><option value="2028">2028</option>
            <option value="2029">2029</option><option value="2030">2030</option>
          </select>
        </div>
        <div class="form-row required cvn">
          <input class="input-text required" type="text" id="dwfrm_billing_paymentMethods_creditCard_cvn_f5a" name="dwfrm_billing_paymentMethods_creditCard_cvn" maxlength="4">
        </div>
      </fieldset>
    </form>

    <!-- Guest checkout entry -->
    <form action="/COCustomer-Start" method="post" id="dwfrm_login_guest">
      <button type="submit" class="button-fancy-large" name="dwfrm_login_unregistered" value="Checkout as guest">Checkout as guest</button>
    </form>
  </div>
</div>
</body>
</html>
